<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI智学助手 - 全学科图形化讲解</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🎓</span>
          <span class="logo-text">AI智学助手</span>
        </div>
        <button class="sidebar-close" id="sidebarClose">✕</button>
      </div>

      <div class="sidebar-section">
        <h3 class="section-title">📚 选择学科</h3>
        <div class="subject-grid">
          <button class="subject-btn active" data-subject="math">
            <span class="subject-icon">📐</span>
            <span class="subject-name">数学</span>
          </button>
          <button class="subject-btn" data-subject="chinese">
            <span class="subject-icon">📝</span>
            <span class="subject-name">语文</span>
          </button>
          <button class="subject-btn" data-subject="english">
            <span class="subject-icon">🔤</span>
            <span class="subject-name">英语</span>
          </button>
          <button class="subject-btn" data-subject="physics">
            <span class="subject-icon">⚡</span>
            <span class="subject-name">物理</span>
          </button>
          <button class="subject-btn" data-subject="chemistry">
            <span class="subject-icon">🧪</span>
            <span class="subject-name">化学</span>
          </button>
          <button class="subject-btn" data-subject="history">
            <span class="subject-icon">📜</span>
            <span class="subject-name">历史</span>
          </button>
          <button class="subject-btn" data-subject="biology">
            <span class="subject-icon">🧬</span>
            <span class="subject-name">生物</span>
          </button>
          <button class="subject-btn" data-subject="geography">
            <span class="subject-icon">🌍</span>
            <span class="subject-name">地理</span>
          </button>
          <button class="subject-btn" data-subject="geometry">
            <span class="subject-icon">📏</span>
            <span class="subject-name">几何</span>
          </button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="section-title">🎯 选择年级</h3>
        <div class="grade-list">
          <div class="grade-group">
            <span class="grade-label">小学</span>
            <div class="grade-btns">
              <button class="grade-btn" data-grade="1">一</button>
              <button class="grade-btn" data-grade="2">二</button>
              <button class="grade-btn" data-grade="3">三</button>
              <button class="grade-btn" data-grade="4">四</button>
              <button class="grade-btn" data-grade="5">五</button>
              <button class="grade-btn" data-grade="6">六</button>
            </div>
          </div>
          <div class="grade-group">
            <span class="grade-label">初中</span>
            <div class="grade-btns">
              <button class="grade-btn active" data-grade="7">初一</button>
              <button class="grade-btn" data-grade="8">初二</button>
              <button class="grade-btn" data-grade="9">初三</button>
            </div>
          </div>
          <div class="grade-group">
            <span class="grade-label">高中</span>
            <div class="grade-btns">
              <button class="grade-btn" data-grade="10">高一</button>
              <button class="grade-btn" data-grade="11">高二</button>
              <button class="grade-btn" data-grade="12">高三</button>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="section-title">🤖 AI模型</h3>
        <div class="model-toggle">
          <button class="model-btn active" data-model="deepseek">
            <span class="model-dot"></span>
            DeepSeek
          </button>
          <button class="model-btn" data-model="bailian">
            <span class="model-dot"></span>
            通义千问
          </button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="section-title">💡 试试这些</h3>
        <div class="quick-questions">
          <button class="quick-q" data-q="为什么负负得正？">为什么负负得正？</button>
          <button class="quick-q" data-q="三角形内角和为什么是180度？">三角形内角和</button>
          <button class="quick-q" data-q="什么是光合作用？">光合作用</button>
          <button class="quick-q" data-q="唐朝为什么那么强大？">唐朝为什么强大</button>
          <button class="quick-q" data-q="二次函数的图像是什么样的？">二次函数图像</button>
          <button class="quick-q" data-q="水分子是什么结构？">水分子结构</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="header-info">
          <span class="header-subject" id="headerSubject">📐 数学</span>
          <span class="header-grade" id="headerGrade">初一</span>
        </div>
        <button class="clear-btn" id="clearBtn" title="清空对话">🗑️</button>
      </header>

      <div class="chat-area" id="chatArea">
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">🎓</div>
          <h1 class="welcome-title">AI智学助手</h1>
          <p class="welcome-desc">我会引导你思考，而不是直接给答案。<br>选择学科和年级，开始探索吧！</p>
          <div class="welcome-features">
            <div class="feature-card">
              <span class="feature-icon">🧠</span>
              <span class="feature-text">引导式思考</span>
            </div>
            <div class="feature-card">
              <span class="feature-icon">📊</span>
              <span class="feature-text">图形化讲解</span>
            </div>
            <div class="feature-card">
              <span class="feature-icon">📚</span>
              <span class="feature-text">全学科覆盖</span>
            </div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            placeholder="输入你的问题，我会引导你思考..."
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
      </div>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>

  <script src="/js/visual.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
